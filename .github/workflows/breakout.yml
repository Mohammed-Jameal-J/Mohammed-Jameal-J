name: Generate Contribution Arcade

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Breakout Contribution Game
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Mohammed-Jameal-J
          games: "breakout"

      - name: Publish Generated Game
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
